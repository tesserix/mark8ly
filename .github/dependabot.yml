version: 2
updates:
  # ── Go services ────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /services/marketplace-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /services/platform-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /services/auth-bff
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /services/otto
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # ── Next.js apps ───────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/storefront
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/onboarding
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Expo packages are versioned in lockstep with the SDK the app pins, so a
  # single-package bump always lands a mismatch. Upgrade with `expo install --fix`.
  - package-ecosystem: npm
    directory: /apps/mobile-admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react-native
  - package-ecosystem: npm
    directory: /apps/storefront-mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react-native

  # ── Workflow actions ───────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
