name: Reusable — security scans
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Single source of truth for CVE / vulnerability scanning. Any workflow
# that runs on pull_request or push-to-main should `uses:` this so we
# can't merge code that pulls in a new HIGH/CRITICAL CVE — on the node
# side OR the Go side — just because the workflow that triggered the
# build didn't happen to run npm audit.
#
# How to call from another workflow:
#
#   jobs:
#     security:
#       uses: ./.github/workflows/reusable-security.yml
#
# The jobs below are deliberately ungated (no `needs:`) so they run in
# parallel with whatever build the caller is performing, and the caller
# can `needs: [security]` on its own deploy/image jobs if it wants a
# hard gate.

on:
  workflow_call:

permissions:
  contents: read
  # @tesserix packages live on GitHub Packages which always requires
  # auth; the install in npm-audit needs to be able to read packages.
  packages: read

jobs:
  npm-audit:
    name: Security — npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          # @tesserix/* are hosted on GitHub Packages which always
          # requires auth even for public packages.
          registry-url: "https://npm.pkg.github.com"
          scope: "@tesserix"
      - name: Install (full tree — audit must see every workspace)
        run: npm install --legacy-peer-deps
        env:
          # Cross-repo package read needs the org PAT — GITHUB_TOKEN
          # only grants access to packages owned by this repo.
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_PAT }}
      - name: npm audit (fail on high+)
        run: |
          set -eo pipefail
          echo "::group::Full tree audit (informational)"
          npm audit --audit-level=moderate || true
          echo "::endgroup::"
          echo "::group::Production-workspace audit (gated)"
          # Capture JSON and run it through audit-gate.py, which fails on any
          # high/critical EXCEPT the narrowly allowlisted advisories (see the
          # script). npm audit exits non-zero when vulns exist, so `|| true`
          # keeps the JSON; the gate script decides pass/fail.
          npm audit --json \
            --audit-level=high \
            --workspace=@mark8ly/admin \
            --workspace=@mark8ly/storefront \
            --workspace=@mark8ly/onboarding \
            --workspace=@repo/ui \
            --workspace=@repo/otto-widget > npm-audit.json || true
          python3 .github/scripts/audit-gate.py npm-audit.json
          echo "::endgroup::"

  govulncheck:
    name: Security — govulncheck (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [platform-api, auth-bff, marketplace-api, otto]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        working-directory: services/${{ matrix.service }}
        # govulncheck narrows the result to CVEs that are actually
        # reachable from the compiled binary — imports alone don't trip
        # it, which dramatically cuts false positives vs plain
        # `go list -m -u`. Non-zero exit = reachable vuln.
        run: govulncheck ./...

  notify-security-failure:
    # Fires when *any* of the gated scans above came back red. The scans
    # already fail the workflow on their own — this job is just the
    # fan-out to the security distribution list so a red main branch
    # doesn't sit unnoticed until someone opens the Actions tab.
    name: Notify — security gate failed
    needs: [npm-audit, govulncheck]
    if: ${{ always() && (needs.npm-audit.result == 'failure' || needs.govulncheck.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Send email alert
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[SECURITY] ${{ github.repository }} — scan failed on ${{ github.ref_name }}"
          from: "Tesserix Security <${{ secrets.SMTP_USERNAME }}>"
          to: samyak.rout@gmail.com, mahesh.sangawar@gmail.com, unidevidp@gmail.com
          body: |
            A security scan failed in ${{ github.repository }}.

            Results:
              npm audit    : ${{ needs.npm-audit.result }}
              govulncheck  : ${{ needs.govulncheck.result }}

            Workflow : ${{ github.workflow }}
            Run      : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Branch   : ${{ github.ref_name }}
            Commit   : ${{ github.sha }}
            Actor    : ${{ github.actor }}

            Check the failing step output for the CVE list.
            Do not merge or deploy until resolved.
