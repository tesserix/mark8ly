name: E2E (storefront, real stack)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# =============================================================================
# mark8ly#858 — the storefront suite against the Tier-D stack.
#
# Until this existed, NO workflow was triggered by apps/storefront/** and the
# storefront's four specs ran nowhere. Measured, not assumed: PRs #996, #1006
# and #1009 were each 100% storefront files and each ran zero e2e checks.
#
# Two of those were total breakage of the buyer flow. #996 fixed Add to cart
# silently dropping every buyer's personalisation; #1009 fixed checkout never
# forwarding the cart token, which also meant every order on the platform was
# committed against stock holds it could not match. Both shipped green. Both
# were found by a human driving a browser.
#
# Six bugs were found that way in one session. Every one was in storefront
# code or its proxy routes. Not one was caught by a test, because for this app
# there were none that ran.
#
# Modelled on e2e-admin.yml deliberately — same stack, same health gate, same
# exact-pass-count canary. A suite that silently runs nothing must not report
# green, which is precisely what the storefront did by running nothing at all.
# =============================================================================
on:
  # Keep these two path lists identical. A path that can break the suite but
  # only appears under `push` is a path whose breakage is found after merge.
  pull_request:
    paths:
      - "apps/storefront/**"
      - "packages/ui/**"
      - "services/marketplace-api/**"
      - "services/platform-api/**"
      - "services/auth-bff/**"
      - "infra/dev/**"
      - "infra/openfga/**"
      - "package-lock.json"
      - ".github/workflows/e2e-storefront.yml"
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - "packages/ui/**"
      - "services/marketplace-api/**"
      - "services/platform-api/**"
      - "services/auth-bff/**"
      - "infra/dev/**"
      - "infra/openfga/**"
      - "package-lock.json"
      - ".github/workflows/e2e-storefront.yml"
  schedule:
    - cron: "30 16 * * *" # 02:30 AEST, after e2e-admin
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storefront:
    name: storefront suite vs real stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Bring up the Tier-D stack
        run: |
          touch infra/dev/.env.local
          make dev-zitadel

      - name: Prove the backend is reachable, not merely running
        # Waits for EACH service rather than polling one and assuming the
        # rest — the mistake e2e-admin.yml documents having made, where
        # whichever service came up slowest decided the outcome.
        run: |
          wait_for() {
            local name="$1" url="$2" host="$3" i
            for i in $(seq 1 60); do
              if [ -n "$host" ]; then
                curl -fsS -H "Host: $host" "$url" >/dev/null 2>&1 && return 0
              else
                curl -fsS "$url" >/dev/null 2>&1 && return 0
              fi
              sleep 2
            done
            echo "::error::$name never became healthy at $url"
            docker compose -f infra/dev/docker-compose.yml logs --tail=40 || true
            return 1
          }
          wait_for platform-api    http://localhost:8086/health        ''
          wait_for auth-bff        http://localhost:8087/health        ''
          wait_for marketplace-api http://localhost:8091/health        ''
          wait_for zitadel         http://localhost:8092/debug/healthz 'zitadel:8080'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/storefront
        run: npx playwright install --with-deps chromium

      - name: Build onboarding and storefront
        env:
          PLATFORM_API_URL: http://localhost:8086
          MARKETPLACE_API_URL: http://localhost:8091
          AUTH_BFF_URL: http://localhost:8087
          SESSION_ENCRYPT_KEY: dev-session-encrypt-key-32-bytes
        # Onboarding too: the storefront specs create a store through it,
        # the same way the admin specs do. Zitadel must already be
        # bootstrapped because NEXT_PUBLIC_ZITADEL_* is inlined at BUILD time.
        run: |
          set -a; . ./infra/dev/.env.zitadel; set +a
          export NEXT_PUBLIC_ZITADEL_ISSUER=http://localhost:8092
          export NEXT_PUBLIC_ZITADEL_ADMIN_CLIENT_ID="$ZITADEL_ADMIN_CLIENT_ID"
          npm run build --workspace @mark8ly/onboarding
          npm run build --workspace @mark8ly/storefront

      - name: Start onboarding and storefront
        env:
          PLATFORM_API_URL: http://localhost:8086
          MARKETPLACE_API_URL: http://localhost:8091
          AUTH_BFF_URL: http://localhost:8087
          SESSION_ENCRYPT_KEY: dev-session-encrypt-key-32-bytes
          PLATFORM_INTERNAL_AUTH_SECRET: dev-internal-auth-secret-not-a-real-key
          MARKETPLACE_STOREFRONT_KEY: dev-storefront-key
        run: |
          npm run start --workspace @mark8ly/onboarding &
          npm run start --workspace @mark8ly/storefront &
          for i in $(seq 1 40); do
            ob=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4201/onboarding || true)
            sf=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4203/ || true)
            [ "$ob" = "200" ] && [ "$sf" = "200" ] && exit 0
            sleep 3
          done
          echo "::error::onboarding ($ob) or storefront ($sf) never came up"
          exit 1

      - name: Run the storefront specs and verify the exact pass count
        working-directory: apps/storefront
        env:
          STOREFRONT_BASE_URL: http://localhost:4203
          ONBOARDING_URL: http://localhost:4201
          API_URL: http://localhost:8086
          AUTH_BFF_URL: http://localhost:8087
          MARKETPLACE_API_URL: http://localhost:8091
          INTERNAL_AUTH_SECRET: dev-internal-auth-secret-not-a-real-key
        # Same three gates as e2e-admin.yml. The pass count is the one that
        # matters: an all-skipped run also exits 0, which is indistinguishable
        # from the state this workflow exists to end.
        run: |
          set -o pipefail
          status=0
          out=$(CI=true npx playwright test --reporter=line 2>&1) || status=$?
          printf '%s\n' "$out"
          fail=0
          if [ "$status" -ne 0 ]; then
            echo "::error::playwright exited $status"
            fail=1
          fi
          # A flaky test is a real defect, so this stays a failure — but it
          # must SAY so, or the exact-count check below sends the reader
          # looking for a broken stack instead of an intermittent test.
          if grep -qE '(^|[^0-9])[0-9]+ flaky' <<<"$out"; then
            echo "::error::a test is FLAKY (passed only on retry) — fix the intermittency rather than re-running"
            fail=1
          fi
          # Seven tests across four spec files: auth-isolation 2, home 3,
          # nav.mobile 1, support-widget.mobile 1. Update this number WITH
          # the spec that changes it, never to make a red run green.
          grep -qE '(^|[^0-9])7 passed' <<<"$out" || {
            echo "::error::did not see exactly 7 passed — the storefront suite is not actually executing and passing"
            fail=1
          }
          if grep -qE '(^|[^0-9])[0-9]+ (failed|timed out)' <<<"$out"; then
            echo "::error::a failed or timed-out test coexists with the expected pass count"
            fail=1
          fi
          exit $fail

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: storefront-e2e-failure
          path: |
            apps/storefront/playwright-report
            apps/storefront/test-results
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f infra/dev/docker-compose.yml logs --tail=80
