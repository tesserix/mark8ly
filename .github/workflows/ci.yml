name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  go:
    name: Go (${{ matrix.service }})
    runs-on: ubuntu-latest
    # Pinned service-container images used by M3+ integration tests in
    # marketplace-api. Keeping them at the job level so all matrix entries
    # see the same pinned versions. M1/M2 don't yet consume these.
    env:
      POSTGRES_IMAGE: postgres:15-alpine
      FGA_IMAGE: openfga/openfga:v1.8.4
      FAKE_GCS_IMAGE: fsouza/fake-gcs-server:1.49.3
    strategy:
      matrix:
        service: [platform-api, auth-bff, marketplace-api, otto]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...
      - name: build
        working-directory: services/${{ matrix.service }}
        run: go build ./...
      # P15 §18.9 — enforce the single choke-point for white-label app
      # credential access. internal/billing/appcreds/ is the ONLY module
      # authorised to hold merchant Apple/Google app credentials. Any file
      # outside the allow-list importing cloud.google.com/go/secretmanager
      # is a regression that bypasses the audit + metrics + tenant-scope
      # guarantees documented in docs/ops/white-label-app-iam.md.
      #
      # Allow-list (pre-existing subsystems with their own credential flows):
      #   - internal/billing/appcreds/      — canonical (P15)
      #   - internal/arbitrage/             — pre-existing arbitrage rotation
      #   - internal/breakglass/            — P13 break-glass credentials
      #   - cmd/arbitrage-rotator/          — entrypoint for arbitrage
      #   - cmd/break-glass-rotation/       — entrypoint for break-glass
      #   - cmd/marketplace-api/main.go     — wires all of the above at boot
      - name: appcreds-chokepoint (marketplace-api only)
        if: matrix.service == 'marketplace-api'
        working-directory: services/${{ matrix.service }}
        run: |
          set -euo pipefail
          offenders=$(grep -RlE '"cloud\.google\.com/go/secretmanager' \
            internal cmd --include='*.go' 2>/dev/null \
            | grep -vE '^(internal/billing/appcreds|internal/arbitrage|internal/breakglass|cmd/arbitrage-rotator|cmd/break-glass-rotation|cmd/marketplace-api/main\.go)' \
            || true)
          if [ -n "$offenders" ]; then
            echo "ERROR: cloud.google.com/go/secretmanager imported outside the allow-list:"
            echo "$offenders"
            echo ""
            echo "White-label app credential reads MUST go through internal/billing/appcreds/."
            echo "See docs/ops/white-label-app-iam.md for the credential choke-point policy."
            exit 1
          fi
      - name: test
        working-directory: services/${{ matrix.service }}
        run: go test ./...

  node:
    name: Node + Turbo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --legacy-peer-deps
      - run: npx turbo run lint check-types build --filter='!@mark8ly/platform-api' --filter='!@mark8ly/auth-bff' --filter='!@mark8ly/otto' --filter='!@repo/storefront-mobile' --filter='!@repo/mobile-admin' --filter='!@repo/mobile-shared'

  # ─── Image build + push ────────────────────────────────────────────
  # Builds 5 immutable images tagged sha-<12-char-commit> and pushes
  # them to GHCR. Skipped on PRs (only main pushes ship images).
  images:
    name: Build & push (${{ matrix.image.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, node]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: mark8ly-platform-api
            dockerfile: services/platform-api/Dockerfile
            context: services/platform-api
            target: server
          - name: mark8ly-auth-bff
            dockerfile: services/auth-bff/Dockerfile
            context: services/auth-bff
            target: server
          - name: mark8ly-marketplace-api
            dockerfile: services/marketplace-api/Dockerfile
            context: services/marketplace-api
            target: runtime
          - name: mark8ly-otto
            dockerfile: services/otto/Dockerfile
            context: services/otto
            target: server
          - name: mark8ly-onboarding
            dockerfile: apps/onboarding/Dockerfile
            context: .
            target: runtime
            google_client_id_secret: NEXT_PUBLIC_GOOGLE_CLIENT_ID
          - name: mark8ly-admin
            dockerfile: apps/admin/Dockerfile
            context: .
            target: runtime
            google_client_id_secret: NEXT_PUBLIC_GOOGLE_CLIENT_ID
          - name: mark8ly-storefront
            dockerfile: apps/storefront/Dockerfile
            context: .
            target: runtime
    steps:
      - uses: actions/checkout@v6

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push (immutable sha tag only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: true
          tags: ghcr.io/tesserix/${{ matrix.image.name }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
          provenance: false
          # Public Next.js config baked into the client bundle at build
          # time. Go service Dockerfiles ignore unknown ARGs, so it's safe
          # to pass these for every image in the matrix.
          build-args: |
            NEXT_PUBLIC_GIP_PROJECT_ID=${{ secrets.NEXT_PUBLIC_GIP_PROJECT_ID }}
            NEXT_PUBLIC_GIP_TENANT_ID=${{ secrets.NEXT_PUBLIC_GIP_TENANT_ID }}
            NEXT_PUBLIC_GIP_API_KEY=${{ secrets.NEXT_PUBLIC_GIP_API_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ matrix.image.google_client_id_secret && secrets[matrix.image.google_client_id_secret] || '' }}
            NEXT_PUBLIC_MARKETING_URL=${{ secrets.NEXT_PUBLIC_MARKETING_URL }}
            NEXT_PUBLIC_ADMIN_URL_TEMPLATE=${{ secrets.NEXT_PUBLIC_ADMIN_URL_TEMPLATE }}
            NEXT_PUBLIC_ADMIN_LOGIN_ORIGIN=${{ secrets.NEXT_PUBLIC_ADMIN_LOGIN_ORIGIN }}

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/tesserix/${{ matrix.image.name }}:sha-${{ steps.sha.outputs.short }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"

  # ─── Bump tesserix-k8s values ──────────────────────────────────────
  # After all images push successfully, commit the mark8ly-* image tag
  # bumps directly to tesserix-k8s main. ArgoCD picks up the commit
  # and rolls the deployments — no PR review step.
  bump-k8s:
    name: Bump tesserix-k8s image tags
    # Requires the TESSERIX_K8S_BOT repo secret — a classic PAT with `repo`
    # scope on tesserix/tesserix-k8s (GITHUB_TOKEN cannot reach another
    # private repo).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Checkout tesserix-k8s
        uses: actions/checkout@v6
        with:
          repository: tesserix/tesserix-k8s
          token: ${{ secrets.TESSERIX_K8S_BOT }}
          path: tesserix-k8s
          ref: main

      - name: Bump image tags via yq
        run: |
          set -euo pipefail
          # marketplace-api-admin and marketplace-api-storefront deploy
          # from the same image (mark8ly-marketplace-api) but as two
          # Knative Services differentiated by MODE env. Both values
          # files receive the same sha tag. The [ ! -f ] guard below
          # means the loop is forward-compatible: when the values files
          # land in tesserix-k8s (M1 Tasks 10–13), this just starts
          # rolling out without another CI change.
          for svc in platform-api auth-bff onboarding admin storefront marketplace-api-admin marketplace-api-storefront otto; do
            f="tesserix-k8s/charts/apps/mark8ly-$svc/values.yaml"
            if [ ! -f "$f" ]; then
              echo "WARN: $f does not exist — skipping"
              continue
            fi
            # Use yq if available, fall back to sed for tag-only fields.
            if command -v yq >/dev/null; then
              yq -i ".image.tag = \"sha-${{ steps.sha.outputs.short }}\"" "$f"
            else
              sed -i "s|^\(\s*tag:\s*\).*|\1\"sha-${{ steps.sha.outputs.short }}\"|" "$f"
            fi
          done

      - name: Commit & push directly to tesserix-k8s main
        working-directory: tesserix-k8s
        run: |
          set -euo pipefail
          git config user.name "tesserix-bot"
          git config user.email "tesserix-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "No image tag changes to commit."
            exit 0
          fi
          git add charts/apps/mark8ly-*/values.yaml
          git commit -m "chore(mark8ly): bump images to sha-${{ steps.sha.outputs.short }}"
          # Retry once on push race (another CI run landing first).
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "Push attempt $attempt failed — rebasing and retrying."
            git pull --rebase origin main
          done
          echo "Push failed after retries." >&2
          exit 1
