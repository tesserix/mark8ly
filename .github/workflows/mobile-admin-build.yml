name: Mobile Admin - EAS Build

on:
  push:
    tags:
      - "mobile-admin-v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        type: choice
        options: [ios, android, all]
        default: ios
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production, development]
        default: production
      submit:
        description: Submit the completed build to the configured store
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-admin-eas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS build (mobile-admin)
    uses: tesserix/tesserix-workflows/.github/workflows/expo-eas-build.yml@v2.1.0
    with:
      working_directory: apps/mobile-admin
      install_directory: .
      lockfile_path: package-lock.json
      node_version: "22"
      legacy_peer_dependencies: true
      platform: ${{ inputs.platform || 'all' }}
      profile: ${{ inputs.profile || 'production' }}
      no_wait: true
      auto_submit: ${{ github.event_name == 'push' || inputs.submit }}
    secrets:
      expo_token: ${{ secrets.EXPO_TOKEN }}
      package_read_token: ${{ secrets.GHCR_PAT }}
