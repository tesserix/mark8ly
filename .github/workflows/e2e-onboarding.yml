name: E2E (onboarding, real stack)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# =============================================================================
# mark8ly#858 — Stage 1 of running the e2e suite against a real backend.
#
# Unlike e2e-runnable.yml, which runs the one spec needing no backend at all,
# this job stands up postgres, OpenFGA and platform-api from the SAME
# infra/dev/docker-compose.yml a developer uses, so the two cannot drift.
#
# NOT triggered on pull_request: the stack plus a cold Next 16 build costs
# several minutes, and the fast gates (unit, tsc, next build, the pricing
# canary, the route manifest) already run there. This catches integration
# drift on a slower cadence.
#
# Pinned to three spec files that are fully clean (commit ddd361ac repaired
# the two that had drifted):
#   - tests/e2e/form-validation.spec.ts    — 2 passed, 0 failed
#   - tests/e2e/invalid-token.spec.ts      — 1 passed, 0 failed
#   - tests/e2e/tax-id-migration.spec.ts   — 4 passed, 5 SKIPPED, 0 failed
# The 5 skips in tax-id-migration are the migration-UI tests, which skip
# themselves while MIGRATION_UI_ENABLED is false
# (apps/onboarding/.../OnboardingForm.tsx:43) — that's a deliberate flag
# check, not a failure, and the skip is derived from the flag's real value
# at test time, so flipping the flag on later revives them.
#
# testMatch selects whole files, so any file with even one failing test is
# excluded wholesale rather than picking individual passing tests out of it
# — the same file-granularity e2e-runnable.yml uses for pricing.spec.ts.
# The four remaining onboarding specs — cross-device-verify.spec.ts,
# golden-path.spec.ts, resume.spec.ts, slug-collision.spec.ts — are excluded
# because every test in them needs Zitadel to complete set-password →
# welcome, which arrives in a later stage of #858. That exclusion stays
# deliberate and visible here, not silent.
# =============================================================================
on:
  push:
    branches: [main]
    paths:
      - "apps/onboarding/**"
      - "services/platform-api/**"
      - "infra/dev/**"
      - "infra/openfga/**"
      - ".github/workflows/e2e-onboarding.yml"
  schedule:
    - cron: "0 16 * * *"   # 02:00 AEST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding:
    name: onboarding suite vs real platform-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Matches ci.yml's Next.js job. Production containers run 24; that
          # divergence is tracked in #857 and must not be changed here.
          node-version: "22"

      - name: Bring up the Tier-B stack
        # No compose override here: on a clean runner 5432 is free, and the
        # override that a developer needs locally is deliberately not
        # committed. If this step ever fails on a port bind, the runner image
        # has started shipping a postgres and this needs the same treatment.
        run: |
          touch infra/dev/.env.local
          make dev-min

      - name: Prove the backend is reachable, not merely running
        # A stack that is "up" but unseeded renders /onboarding as a 500 and
        # every spec then fails on a timeout that names nothing useful.
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8086/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8086/health >/dev/null \
            || { echo "::error::platform-api never became healthy"; docker compose -f infra/dev/docker-compose.yml logs platform-api; exit 1; }
          countries=$(curl -fsS http://localhost:8086/api/v1/locations/countries | jq '.data | length')
          [ "$countries" -gt 0 ] \
            || { echo "::error::locations seed is empty ($countries) — platform-api-seed did not run"; exit 1; }
          store=$(curl -fsS http://localhost:8089/stores | jq -r '.stores[] | select(.name=="mark8ly-platform") | .id')
          [ -n "$store" ] \
            || { echo "::error::openfga store mark8ly-platform missing — openfga-seed did not run"; exit 1; }

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        working-directory: apps/onboarding
        run: npx playwright install --with-deps chromium

      - name: Build onboarding
        working-directory: apps/onboarding
        # Its own step, not playwright webServer: a cold Next 16 build
        # routinely exceeds three minutes and would red the job on the build
        # clock rather than on anything a spec asserts.
        env:
          PLATFORM_API_URL: http://localhost:8086
        run: npm run build

      - name: Start onboarding
        working-directory: apps/onboarding
        env:
          PLATFORM_API_URL: http://localhost:8086
          PORT: "4201"
        run: |
          npm run start &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4201/onboarding || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "::error::/onboarding never returned 200 (last: ${code:-none})"
          exit 1

      - name: Run the onboarding suite and verify the exact pass count
        working-directory: apps/onboarding
        env:
          BASE_URL: http://localhost:4201
          API_URL: http://localhost:8086
        # FOUR gates, as in e2e-runnable.yml (was three; skips are now
        # counted too — see below). None is sufficient alone:
        #  - playwright's exit status;
        #  - exactly 7 PASSED, because an all-skipped run also exits 0 —
        #    the mark8ly#834 failure this job exists to prevent;
        #  - no "N failed"/"N timed out", so a correct pass count can never
        #    coexist with a failure;
        #  - exactly 5 SKIPPED. A skip that nobody counts is how a suite
        #    quietly stops testing things: tax-id-migration.spec.ts's 5
        #    migration tests skip behind MIGRATION_UI_ENABLED (see the
        #    header comment). If that flag flips on and those tests start
        #    running (or start failing), the skip count changes and this
        #    job must notice rather than silently reporting 7 passed as
        #    before.
        # Patterns are not anchored to start-of-line: the reporter emits ANSI
        # cursor escapes ahead of the summary. [^0-9] stops "7 passed"
        # matching a larger count (e.g. "17 passed" does not match, because
        # the character before "7" is "1", not start-of-string or a
        # non-digit) — same discipline applied to "5 skipped".
        #
        # The three spec files are passed explicitly rather than relying on
        # testMatch in the shared playwright.config.ts (which also serves
        # local `make dev` runs against the full suite) — see the header
        # comment above for why every other spec file is excluded at this
        # stage.
        run: |
          set -o pipefail
          status=0
          out=$(CI=true npx playwright test tests/e2e/form-validation.spec.ts tests/e2e/invalid-token.spec.ts tests/e2e/tax-id-migration.spec.ts --reporter=line 2>&1) || status=$?
          printf '%s\n' "$out"
          fail=0
          if [ "$status" -ne 0 ]; then
            echo "::error::playwright exited $status"
            fail=1
          fi
          grep -qE '(^|[^0-9])7 passed' <<<"$out" || {
            echo "::error::did not see exactly 7 passed — the onboarding suite is not actually executing and passing"
            fail=1
          }
          if grep -qE '(^|[^0-9])[0-9]+ (failed|timed out)' <<<"$out"; then
            echo "::error::a failed or timed-out test coexists with the expected pass count"
            fail=1
          fi
          grep -qE '(^|[^0-9])5 skipped' <<<"$out" || {
            echo "::error::did not see exactly 5 skipped — the tax-id-migration skip count changed, investigate before trusting the pass count"
            fail=1
          }
          exit $fail

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f infra/dev/docker-compose.yml logs --no-color --tail=200

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: onboarding-e2e-failure
          path: apps/onboarding/test-results/
          if-no-files-found: ignore
          retention-days: 7
