name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  go:
    name: Go (${{ matrix.service }})
    runs-on: ubuntu-latest
    # Pinned service-container images used by M3+ integration tests in
    # marketplace-api. Keeping them at the job level so all matrix entries
    # see the same pinned versions. M1/M2 don't yet consume these.
    env:
      POSTGRES_IMAGE: postgres:15-alpine
      FGA_IMAGE: openfga/openfga:v1.8.4
      FAKE_GCS_IMAGE: fsouza/fake-gcs-server:1.49.3
    strategy:
      matrix:
        service: [platform-api, auth-bff, marketplace-api, otto]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...
      - name: build
        working-directory: services/${{ matrix.service }}
        run: go build ./...
      # P15 §18.9 — enforce the single choke-point for white-label app
      # credential access. internal/billing/appcreds/ is the ONLY module
      # authorised to hold merchant Apple/Google app credentials. Any file
      # outside the allow-list importing cloud.google.com/go/secretmanager
      # is a regression that bypasses the audit + metrics + tenant-scope
      # guarantees documented in docs/ops/white-label-app-iam.md.
      #
      # Allow-list (pre-existing subsystems with their own credential flows):
      #   - internal/billing/appcreds/      — canonical (P15)
      #   - internal/arbitrage/             — pre-existing arbitrage rotation
      #   - internal/breakglass/            — P13 break-glass credentials
      #   - internal/carriersecrets/        — per-tenant carrier credentials
      #                                        (Delhivery, Razorpay, TaxJar, ...)
      #                                        Single Store abstraction routes
      #                                        every carrier read/write; the
      #                                        only package allowed to hold
      #                                        merchant carrier tokens.
      #   - cmd/arbitrage-rotator/          — entrypoint for arbitrage
      #   - cmd/break-glass-rotation/       — entrypoint for break-glass
      #   - cmd/marketplace-api/main.go     — wires all of the above at boot
      - name: appcreds-chokepoint (marketplace-api only)
        if: matrix.service == 'marketplace-api'
        working-directory: services/${{ matrix.service }}
        run: |
          set -euo pipefail
          offenders=$(grep -RlE '"cloud\.google\.com/go/secretmanager' \
            internal cmd --include='*.go' 2>/dev/null \
            | grep -vE '^(internal/billing/appcreds|internal/arbitrage|internal/breakglass|internal/carriersecrets|cmd/arbitrage-rotator|cmd/break-glass-rotation|cmd/marketplace-api/main\.go)' \
            || true)
          if [ -n "$offenders" ]; then
            echo "ERROR: cloud.google.com/go/secretmanager imported outside the allow-list:"
            echo "$offenders"
            echo ""
            echo "White-label app credential reads MUST go through internal/billing/appcreds/."
            echo "See docs/ops/white-label-app-iam.md for the credential choke-point policy."
            exit 1
          fi
      - name: test
        working-directory: services/${{ matrix.service }}
        run: go test ./...

  node:
    name: Node + Turbo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --legacy-peer-deps
      - run: npx turbo run lint check-types build --filter='!@mark8ly/platform-api' --filter='!@mark8ly/auth-bff' --filter='!@mark8ly/otto' --filter='!@repo/storefront-mobile' --filter='!@repo/mobile-admin' --filter='!@repo/mobile-shared'

  # ─── Security scans ────────────────────────────────────────────────
  # CVE / vulnerability gating is centralised in reusable-security.yml
  # so every workflow — present and future — picks up the same bar.
  # The image matrix below `needs: [security]` to ensure a new CRITICAL
  # or HIGH finding halts the deploy.
  security:
    uses: ./.github/workflows/reusable-security.yml

  # ─── Image build + push ────────────────────────────────────────────
  # Builds 5 immutable images tagged sha-<12-char-commit> and pushes
  # them to GHCR. Skipped on PRs (only main pushes ship images).
  images:
    name: Build & push (${{ matrix.image.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, node, security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: mark8ly-platform-api
            dockerfile: services/platform-api/Dockerfile
            context: services/platform-api
            target: server
          - name: mark8ly-auth-bff
            dockerfile: services/auth-bff/Dockerfile
            context: services/auth-bff
            target: server
          - name: mark8ly-marketplace-api
            dockerfile: services/marketplace-api/Dockerfile
            context: services/marketplace-api
            target: runtime
          - name: mark8ly-otto
            dockerfile: services/otto/Dockerfile
            context: services/otto
            target: server
          - name: mark8ly-onboarding
            dockerfile: apps/onboarding/Dockerfile
            context: .
            target: runtime
            google_client_id_secret: NEXT_PUBLIC_GOOGLE_CLIENT_ID
          - name: mark8ly-admin
            dockerfile: apps/admin/Dockerfile
            context: .
            target: runtime
            google_client_id_secret: NEXT_PUBLIC_GOOGLE_CLIENT_ID
          - name: mark8ly-storefront
            dockerfile: apps/storefront/Dockerfile
            context: .
            target: runtime
    steps:
      - uses: actions/checkout@v6

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push (immutable sha tag only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: true
          tags: ghcr.io/tesserix/${{ matrix.image.name }}:main-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
          provenance: false
          # Public Next.js config baked into the client bundle at build
          # time. Go service Dockerfiles ignore unknown ARGs, so it's safe
          # to pass these for every image in the matrix.
          build-args: |
            NEXT_PUBLIC_GIP_PROJECT_ID=${{ secrets.NEXT_PUBLIC_GIP_PROJECT_ID }}
            NEXT_PUBLIC_GIP_TENANT_ID=${{ secrets.NEXT_PUBLIC_GIP_TENANT_ID }}
            NEXT_PUBLIC_GIP_CUSTOMER_TENANT_ID=MP-Customer-39opy
            NEXT_PUBLIC_GIP_API_KEY=${{ secrets.NEXT_PUBLIC_GIP_API_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ matrix.image.google_client_id_secret && secrets[matrix.image.google_client_id_secret] || '' }}
            NEXT_PUBLIC_MARKETING_URL=${{ secrets.NEXT_PUBLIC_MARKETING_URL }}
            NEXT_PUBLIC_ADMIN_URL_TEMPLATE=${{ secrets.NEXT_PUBLIC_ADMIN_URL_TEMPLATE }}
            NEXT_PUBLIC_ADMIN_LOGIN_ORIGIN=${{ secrets.NEXT_PUBLIC_ADMIN_LOGIN_ORIGIN }}

      - name: Trivy scan (fail on CRITICAL + HIGH)
        # Gate tightened from CRITICAL-only to CRITICAL,HIGH so a new
        # exploitable CVE in the built image halts the deploy instead of
        # merely emitting a security-tab alert that no one follows up on.
        # ignore-unfixed stays on so upstream-only-fixed-in-HEAD advisories
        # (which we can't act on) don't hold up ops. trivyignores lists
        # CVE IDs we've explicitly triaged as false-positives; each entry
        # in .trivyignore carries a rationale + review date.
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/tesserix/${{ matrix.image.name }}:main-${{ steps.sha.outputs.short }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          trivyignores: .trivyignore

