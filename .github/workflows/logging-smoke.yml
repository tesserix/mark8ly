name: Log-shipping PII smoke guard
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# =============================================================================
# P17 Task 12 — static grep that prevents fmt.Print* from leaking structured
# field values (tenant_id, email, trace_id, etc.) through unstructured log
# lines instead of the slog/logrus JSON pipeline.
# =============================================================================
on:
  push:
    branches: [main]
    paths:
      - "services/**/*.go"
      - "scripts/ci/verify-logging-smoke.sh"
  pull_request:
    paths:
      - "services/**/*.go"
      - "scripts/ci/verify-logging-smoke.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Centralised CVE / vulnerability gate — see
  # .github/workflows/reusable-security.yml. Every workflow pulls this in
  # so a new HIGH/CRITICAL CVE blocks merges even when the
  # workflow-specific path filter skipped the main CI build.
  security:
    uses: ./.github/workflows/reusable-security.yml

  logging-smoke:
    name: Log-shipping smoke guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run log-shipping PII smoke guard
        run: bash scripts/ci/verify-logging-smoke.sh
