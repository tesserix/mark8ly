name: Transfer Expo token to Roamie
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-24.04
    steps:
      - name: Install sealed-box encryption
        run: sudo apt-get update -qq && sudo apt-get install -y python3-nacl
      - name: Encrypt existing token for Roamie only
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          DESTINATION_KEY: MzBEZdtJNiBVP1z7bfwoq5ywzVw8ciO+KZ6fbMmN5kQ=
          DESTINATION_KEY_ID: '3380204578043523366'
        run: |
          /usr/bin/python3 - <<'PYTHON'
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          token = os.environ['EXPO_TOKEN'].strip()
          if not token:
              raise SystemExit('Source EXPO_TOKEN is missing.')
          encrypted = SealedBox(PublicKey(base64.b64decode(os.environ['DESTINATION_KEY']))).encrypt(token.encode())
          with open('roamie-expo-token.sealed.json', 'w') as output:
              json.dump({'key_id': os.environ['DESTINATION_KEY_ID'], 'encrypted_value': base64.b64encode(encrypted).decode()}, output)
          print('Created ciphertext for the Roamie repository public key.')
          PYTHON
      - name: Upload encrypted transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roamie-expo-token-sealed
          path: roamie-expo-token.sealed.json
          retention-days: 1
          if-no-files-found: error
