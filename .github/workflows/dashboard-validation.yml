name: Dashboard Validation
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# =============================================================================
# Validates Grafana dashboard JSON + PromQL metric references.
# Runs on any PR that touches the validator / dashboards; also on push to main
# so drift caused by direct commits surfaces immediately.
#
# Dashboards live in the sibling tesserix-k8s repo; we check it out into
# ./tesserix-k8s so the script finds the expected relative path.
# =============================================================================
on:
  pull_request:
    paths:
      - "scripts/ci/verify-dashboard-queries.sh"
      - ".github/workflows/dashboard-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ci/verify-dashboard-queries.sh"
      - ".github/workflows/dashboard-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Required by reusable-security.yml, which declares `packages: read` for its
  # @tesserix/* install. A caller cannot grant a reusable workflow more than it
  # holds itself, so omitting this fails the whole run at STARTUP — before any
  # job executes and with no log to read.
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Centralised CVE / vulnerability gate — see
  # .github/workflows/reusable-security.yml. Every workflow pulls this in
  # so a new HIGH/CRITICAL CVE blocks merges even when the
  # workflow-specific path filter skipped the main CI build.
  security:
    uses: ./.github/workflows/reusable-security.yml
    # Reusable workflows need explicit secret forwarding — GITHUB_TOKEN passes
    # automatically but org PATs like GHCR_PAT do not, and npm-audit's install
    # authenticates to GitHub Packages with it.
    secrets: inherit

  validate:
    name: Validate dashboards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mark8ly
        uses: actions/checkout@v7
        with:
          path: mark8ly

      - name: Checkout tesserix-k8s
        uses: actions/checkout@v7
        with:
          repository: tesserix/tesserix-k8s
          token: ${{ secrets.TESSERIX_K8S_BOT }}
          path: tesserix-k8s
          ref: main

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Validate dashboards
        working-directory: mark8ly
        run: bash scripts/ci/verify-dashboard-queries.sh
