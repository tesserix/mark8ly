# Local development stack for the onboarding-only first slice.
#
# Run with:  make dev
# Stop with: make dev-down
# Wipe with: make dev-clean
#
# What's running:
#   - postgres            Multi-DB Postgres (platform_api, auth_bff, openfga)
#   - openfga             Real OpenFGA backed by Postgres
#   - openfga-seed        Loads the authorization model on first boot (one-shot)
#   - platform-api        Go API (with migrate init container)
#   - auth-bff            Go auth service (with migrate init container)
#
# What's NOT running here:
#   - The onboarding Next.js app — run on host with `cd apps/onboarding && npm run dev`
#   - Any identity provider — the Tier-B stack runs without one. Specs that
#     need sign-in are enabled in Stage 3 (#858), which adds a disposable
#     Zitadel to this file. Do not point this stack at the shared live
#     instance at auth.tesserix.app.

services:

  # ──────────────────────────────────────────────────────────────────────
  # Storage
  # ──────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_MULTIPLE_DATABASES: platform_api,auth_bff,openfga,marketplace_db,zitadel
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ──────────────────────────────────────────────────────────────────────
  # Authorization (OpenFGA)
  # ──────────────────────────────────────────────────────────────────────

  openfga-migrate:
    image: openfga/openfga:v1.8.4
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://dev:dev@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  openfga:
    image: openfga/openfga:v1.8.4
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://dev:dev@postgres:5432/openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: text
      OPENFGA_PLAYGROUND_ENABLED: "true"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    ports:
      - "8089:8080"  # http
      - "8090:8081"  # grpc
      # playground (3000) intentionally not exposed — conflicts with common dev servers
    # No healthcheck: openfga image is distroless, has no shell/wget/curl.
    # The openfga-seed init container does its own wait-for-ready loop.

  openfga-seed:
    image: alpine:3.20
    depends_on:
      openfga:
        condition: service_started
    volumes:
      - ./seed:/seed:ro
    entrypoint: ["sh", "/seed/fga-init.sh"]
    restart: "no"

  # ──────────────────────────────────────────────────────────────────────
  # Go services
  # ──────────────────────────────────────────────────────────────────────

  # ─── Zitadel (#858 stage 3) ──────────────────────────────────────────
  # Pinned to the major tesserix-k8s runs. `start-from-init` creates the
  # schema, the first instance, its org and a machine user, then serves —
  # one container instead of the init/setup/start trio, which matters here
  # because CI waits on it before it can build any Next app.
  # A named volume is created root-owned, and the zitadel image runs as a
  # non-root user with no shell to fix it from. Without this, setup dies on
  # `open /pat/pat: permission denied` at migration 03_default_instance and
  # the container exits 1 — after appearing to run 40 migrations fine.
  #
  # chmod rather than chown: the image has no shell and no /etc/passwd we
  # can read, so the uid is not knowable from here. Mode 1777 (sticky, like
  # /tmp) works whatever uid the image ships. Dev/CI only — this volume
  # holds one throwaway token for an instance rebuilt on every run.
  zitadel-pat-init:
    image: alpine:3.19
    command: ["chmod", "1777", "/pat"]
    volumes:
      - zitadel-pat:/pat
    restart: "no"

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.15.3
    # The masterkey is exactly 32 bytes and is a DEV-ONLY constant: this
    # instance is created empty on every run and holds nothing but test
    # fixtures. Do not copy it anywhere a real instance can reach.
    command: >-
      start-from-init
      --masterkey MasterkeyNeedsToHave32Characters
      --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: dev
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: dev
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: dev
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: dev
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Zitadel resolves the instance from the request's Host header. These
      # three decide what that domain is, and every caller must send it —
      # a container-internal service name matches no instance and returns
      # "Instance not found" (the same scar the k8s bootstrap.py records).
      ZITADEL_EXTERNALSECURE: "false"
      # The instance domain is the CONTAINER name, not localhost, because
      # the only in-stack caller is platform-api and it reaches Zitadel at
      # http://zitadel:8080 — so its Host header must be `zitadel:8080` for
      # the instance to resolve at all.
      #
      # Consequence for host-side callers (the bootstrap script, any curl):
      # connect to localhost:8092 but send `Host: zitadel:8080` explicitly,
      # or every request 404s with "Instance not found".
      #
      # Stage 3b, which puts a BROWSER through the OIDC flow, will need a
      # second instance domain so the same instance answers to both names.
      ZITADEL_EXTERNALDOMAIN: zitadel
      ZITADEL_EXTERNALPORT: "8080"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: mark8ly
      # The PAT is written here at first start and read by the bootstrap
      # container. That is the ONLY moment the token is retrievable.
      ZITADEL_FIRSTINSTANCE_PATPATH: /pat/pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: bootstrap
      # Without an explicit PAT block no token is minted and PATPATH stays
      # empty — the machine user alone is not enough. Verified against
      # v4.15.3 by watching /pat stay empty with the two keys above only.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2519-04-01T08:45:00Z"
    depends_on:
      postgres:
        condition: service_healthy
      zitadel-pat-init:
        condition: service_completed_successfully
    volumes:
      - zitadel-pat:/pat
    ports:
      - "8092:8080"

  platform-api-migrate:
    build:
      context: ../..
      dockerfile: services/platform-api/Dockerfile
      target: migrate
    environment:
      ENV: dev
      DATABASE_URL: postgres://dev:dev@postgres:5432/platform_api?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    # Full argv: the migrate stage sets CMD with no ENTRYPOINT, so a bare
    # ["up"] replaces the binary instead of being passed to it.
    command: ["/migrate", "up"]
    restart: "no"

  platform-api-seed:
    build:
      context: ../..
      dockerfile: services/platform-api/Dockerfile
      target: seed
    environment:
      ENV: dev
      DATABASE_URL: postgres://dev:dev@postgres:5432/platform_api?sslmode=disable
    depends_on:
      platform-api-migrate:
        condition: service_completed_successfully
    restart: "no"

  platform-api:
    build:
      context: ../..
      dockerfile: services/platform-api/Dockerfile
      target: server
    env_file:
      - .env.local
      # Written by infra/dev/zitadel-bootstrap.py, and gitignored. Compose
      # reads env_file when it CREATES the container, so the bootstrap must
      # run before `up platform-api` -- `make dev-zitadel` does that ordering.
      # `required: false` keeps `make dev-min` working with no Zitadel at all;
      # platform-api's ZITADEL_ENABLED then stays at its false default.
      - path: .env.zitadel
        required: false
    environment:
      ENV: dev
      HTTP_PORT: "8086"
      DATABASE_URL: postgres://dev:dev@postgres:5432/platform_api?sslmode=disable
      FGA_API_URL: http://openfga:8080
      # Without this, platform-api keeps its production default
      # (mark8ly-marketplace-api-admin.mark8ly.svc.cluster.local:8080) and
      # every onboarding Complete spends ~20s failing DNS three times --
      # ensure-self-vendor, ensure-self-store and ensure-subscription --
      # then logs "THIS STORE HAS NO TRIAL CLOCK". The store is created
      # either way, so the dev stack silently produced trial-less stores.
      MARKETPLACE_API_URL: http://marketplace-api:8091
      # Phase P: accept-invite links in invitation emails. Host-side
      # admin dev server — container-internal defaults don't resolve
      # for the user clicking the link in their mail client.
      ADMIN_BASE_URL_TEMPLATE: http://localhost:4202
      STOREFRONT_BASE_URL_TEMPLATE: http://localhost:4203
    depends_on:
      platform-api-migrate:
        condition: service_completed_successfully
      platform-api-seed:
        condition: service_completed_successfully
      openfga-seed:
        condition: service_completed_successfully
    ports:
      - "8086:8086"

  auth-bff-migrate:
    build:
      context: ../../services/auth-bff
      target: migrate
    environment:
      ENV: dev
      DATABASE_URL: postgres://dev:dev@postgres:5432/auth_bff?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    # Full argv: the migrate stage sets CMD with no ENTRYPOINT, so a bare
    # ["up"] replaces the binary instead of being passed to it.
    command: ["/migrate", "up"]
    restart: "no"

  auth-bff:
    build:
      context: ../../services/auth-bff
      target: server
    env_file:
      - .env.local
      # Written by infra/dev/zitadel-bootstrap.py before this container is
      # created (see `make dev-zitadel`). Supplies ZITADEL_ENABLED, the
      # issuer, org/project ids, the login-client PAT, and the admin OIDC
      # client id + secret. required:false keeps `make dev-min` working.
      - path: .env.zitadel
        required: false
    environment:
      ENV: dev
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://dev:dev@postgres:5432/auth_bff?sslmode=disable
      FGA_API_URL: http://openfga:8080
      SESSION_COOKIE_DOMAIN: localhost
      # Every one of these is REQUIRED by ValidateZitadel once
      # ZITADEL_ENABLED is true; auth-bff panics at startup naming the
      # missing key rather than degrading, which is the right behaviour and
      # also why they must all be here rather than discovered one restart
      # at a time.
      PLATFORM_API_URL: http://platform-api:8086
      MARKETPLACE_INTERNAL_AUTH_SECRET: dev-internal-auth-secret-not-a-real-key
      SESSION_ENCRYPT_KEY: dev-session-encrypt-key-32-bytes
      # Host only (no port), and it MUST have two labels. auth-bff's
      # NewReturnURLAllowlist rejects a bare "localhost" outright -- a
      # single label is treated as a bare TLD that would match every domain
      # under it. The rule is right for production and leaves plain
      # `localhost` inexpressible, so the local stack uses *.localhost,
      # which RFC 6761 requires resolvers to send to 127.0.0.1 and which
      # Chromium honours. Drive the specs at http://admin.localhost:4202.
      ZITADEL_RETURN_URL_ALLOWED_HOSTS_ADMIN: admin.localhost
      ZITADEL_RETURN_URL_ALLOWED_HOSTS_STOREFRONT: store.localhost
    depends_on:
      auth-bff-migrate:
        condition: service_completed_successfully
      zitadel:
        condition: service_started
    # Host port 8087 → container 8080 (8080 is commonly taken on dev machines)
    ports:
      - "8087:8080"

  marketplace-api-migrate:
    build:
      # Repo root, not the service dir: the Dockerfile COPYs
      # services/marketplace-api/ AND packages/platformauth/, so a
      # service-scoped context cannot see the shared module. Same fix
      # platform-api got in #858 stage 1; this service was missed.
      context: ../..
      dockerfile: services/marketplace-api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://dev:dev@postgres:5432/marketplace_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    # Full argv: the migrate stage sets CMD with no ENTRYPOINT, so a bare
    # ["up"] replaces the binary instead of being passed to it.
    command: ["/usr/local/bin/migrate", "up"]
    restart: "no"

  marketplace-api:
    build:
      # Repo root, not the service dir: the Dockerfile COPYs
      # services/marketplace-api/ AND packages/platformauth/, so a
      # service-scoped context cannot see the shared module. Same fix
      # platform-api got in #858 stage 1; this service was missed.
      context: ../..
      dockerfile: services/marketplace-api/Dockerfile
      target: runtime
    environment:
      ENV: dev
      MODE: both
      HTTP_PORT: "8091"
      DATABASE_URL: postgres://dev:dev@postgres:5432/marketplace_db?sslmode=disable
      # Required unconditionally by pkg/config (envconfig required:"true");
      # without it the container panics at startup rather than degrading.
      # Container-internal port, not the published 8091 -> openfga is 8080
      # inside the network even though the host sees it on 8089.
      MARKETPLACE_FGA_API_URL: http://openfga:8080
      # ENV=dev also exempts this service from Validate()'s prod-only
      # requirements (MARKETPLACE_INTERNAL_AUTH_SECRET, CUSTOMER_SESSION_SECRET,
      # ENCRYPTION_MODE=aes + ENCRYPTION_KEY).
    depends_on:
      marketplace-api-migrate:
        condition: service_completed_successfully
      openfga-seed:
        condition: service_completed_successfully
    ports:
      - "8091:8091"
    # No healthcheck: the runtime stage is base-distroless-static, which has
    # no shell, wget or curl -- same reason openfga above declares none. The
    # wget probe that used to sit here could never pass, so the container sat
    # permanently `unhealthy` while serving 200s. Nothing noticed because the
    # service could not start at all until #875. Anything that needs to wait
    # for this service must poll http://localhost:8091/health from outside,
    # as .github/workflows/e2e-onboarding.yml already does for platform-api;
    # a `condition: service_healthy` on it would block forever.

volumes:
  postgres-data:
  zitadel-pat:
