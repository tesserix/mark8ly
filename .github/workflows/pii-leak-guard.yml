name: PII Leak Guard
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# =============================================================================
# Blocks PRs that add log statements containing suspected PII fields.
# Conservative grep over diff-added lines only; false positives (hashed or
# redacted values) can be cleared by applying the `pii-audit-cleared` label.
# =============================================================================
on:
  pull_request:
    paths:
      - "services/**/*.go"

permissions:
  contents: read
  pull-requests: read
  # Required by reusable-security.yml, which declares `packages: read` for its
  # @tesserix/* install. A caller cannot grant a reusable workflow more than it
  # holds itself, so omitting this fails the whole run at STARTUP — before any
  # job executes and with no log to read. That is why this guard silently never
  # ran despite appearing in the checks list.
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Centralised CVE / vulnerability gate — see
  # .github/workflows/reusable-security.yml. Every workflow pulls this in
  # so a new HIGH/CRITICAL CVE blocks merges even when the
  # workflow-specific path filter skipped the main CI build.
  security:
    uses: ./.github/workflows/reusable-security.yml
    # Reusable workflows need explicit secret forwarding — GITHUB_TOKEN passes
    # automatically but org PATs like GHCR_PAT do not, and npm-audit's install
    # authenticates to GitHub Packages with it.
    secrets: inherit

  pii-grep:
    name: Grep added log lines for PII fields
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'pii-audit-cleared')"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git diff origin/<base>...HEAD` resolves.
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${GITHUB_BASE_REF}:${GITHUB_BASE_REF}" --depth=50

      - name: Grep for PII in added log lines
        run: bash scripts/ci/grep-pii-logs.sh
