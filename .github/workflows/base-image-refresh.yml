name: Base Image Update Guard

on:
  repository_dispatch:
    types: [base-image-refresh, tesserix-base-images-updated]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest-policy:
    name: Verify pinned base update path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate immutable bases and Dependabot coverage
        run: python3 .github/scripts/test-ci-contract.py
      - name: Explain update ownership
        run: |
          echo "::notice::Base images remain pinned until the Docker Dependabot update PR passes CI."
          echo "::notice::The upstream dispatch contains no digests and cannot safely mutate Dockerfiles."
