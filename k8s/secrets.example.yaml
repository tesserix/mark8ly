# mark8ly — single LOCAL Secret for kind / local-cluster deploys.
#
# Copy-and-go:
#   cp k8s/secrets.example.yaml k8s/secrets.yaml
#   # (edit values if you want; the defaults below are fine for local dev)
#   kubectl create namespace mark8ly --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f k8s/secrets.yaml
#
# Every mark8ly chart's values-local.yaml in tesserix-k8s points its secret
# refs at THIS one Secret (mark8ly-local-secrets). Prod is completely separate
# (per-service ExternalSecrets synced from GCP Secret Manager) and is NOT
# affected by this file.
#
# NOTE: the shared local-infra chart reflects a Secret named `local-infra-creds`
# into the mark8ly namespace; it carries the SAME throwaway password
# (local-sandbox-dev) for the shared CNPG Postgres / Redis / Mongo. The values
# below match it so every service authenticates against the shared datastores.
#
# These are LOCAL-ONLY throwaway values. Never reuse them anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: mark8ly-local-secrets
  namespace: mark8ly
type: Opaque
stringData:
  # ── Shared local-infra Postgres (CNPG, local-pg-rw.local-infra) ───
  # username/password are read by every Go service's DB env block (helper
  # builds DATABASE_URL from these two keys). username MUST equal the shared
  # CNPG role (mark8ly); password MUST equal the shared throwaway password
  # (local-sandbox-dev) so it matches the reflected local-infra-creds Secret.
  POSTGRES_PASSWORD: "local-sandbox-dev"
  username: "mark8ly"
  password: "local-sandbox-dev"

  # ── Cross-service trust (shared X-Internal-Auth) ──────────────────
  # One value shared by platform-api, marketplace-api (admin+storefront),
  # auth-bff, admin, storefront, otto. The Go services constant-time compare
  # this header; a single shared value keeps every internal call authorized.
  INTERNAL_AUTH_SECRET: "local-internal-auth-secret"

  # ── Session / encryption (must be present; some are NOT optional) ──
  # 32-byte-ish keys are fine for local. Regenerate with `openssl rand -hex 32`.
  SESSION_ENCRYPT_KEY: "local-session-encrypt-key-change-me-000000000000"
  ENCRYPTION_KEY: "local-encryption-key-change-me-0000000000000000"
  STOREFRONT_KEY: "local-storefront-key"
  CUSTOMER_SESSION_SECRET: "local-customer-session-secret"

  # ── GIP / OAuth (no-op locally; keys must EXIST, empty is fine) ────
  # These env vars are non-optional in several deployments, so the keys must
  # be present even though GIP/Google sign-in is not wired up on kind.
  GIP_WEB_API_KEY: ""                 # prod GCP SM: prod-mark8ly-gip-web-api-key
  GIP_WEB_API_KEY_RESOURCE_NAME: ""   # prod GCP SM: prod-mark8ly-gip-web-api-key-resource-name
  OAUTH_CLIENT_SECRET: ""             # prod GCP SM: prod-mark8ly-oauth-client-secret

  # ── Email / telemetry / billing (all OPTIONAL keys) ───────────────
  # Present so the single Secret satisfies every chart ref; safe to leave blank.
  # When empty, services fall back to a stdout mailer / disabled telemetry.
  SENDGRID_API_KEY: ""
  AUDIT_INGEST_SECRET: ""
  SENTRY_DSN: ""
  STRIPE_BILLING_SECRET_KEY: ""
  STRIPE_BILLING_WEBHOOK_SECRET: ""
