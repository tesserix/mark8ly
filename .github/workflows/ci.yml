name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  policy:
    name: Product policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.images.outputs.value }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate CI contract
        run: python3 .github/scripts/test-ci-contract.py
      - name: Enforce application-credential choke point
        working-directory: services/marketplace-api
        run: |
          offenders=$(grep -RlE '"cloud\.google\.com/go/secretmanager' internal cmd --include='*.go' 2>/dev/null \
            | grep -vE '^(internal/billing/appcreds|internal/arbitrage|internal/breakglass|internal/carriersecrets|cmd/arbitrage-rotator|cmd/break-glass-rotation|cmd/marketplace-api/main\.go)' \
            || true)
          if [[ -n "$offenders" ]]; then
            printf 'Secret Manager import outside the approved choke point:\n%s\n' "$offenders"
            exit 1
          fi
      - name: Export image contract
        id: images
        run: echo "value=$(jq -c . .github/ci/container-images.json)" >> "$GITHUB_OUTPUT"

  go:
    name: Go (${{ matrix.service }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: platform-api
            directory: services/platform-api
            coverage: 25
          - service: auth-bff
            directory: services/auth-bff
            coverage: 31
          - service: marketplace-api
            directory: services/marketplace-api
            coverage: 21
          - service: otto
            directory: services/otto
            coverage: 4
    uses: tesserix/tesserix-workflows/.github/workflows/go-ci.yml@v2.2.1
    with:
      working_directory: ${{ matrix.directory }}
      go_version: 1.26.6
      coverage_min_lines: ${{ matrix.coverage }}

  nextjs:
    name: Next.js
    uses: tesserix/tesserix-workflows/.github/workflows/nextjs-ci.yml@v2.2.1
    with:
      working_directory: .
      node_version: "22"
      legacy_peer_dependencies: true
      audit_workspaces: >-
        @mark8ly/admin
        @mark8ly/storefront
        @mark8ly/onboarding
        @repo/ui
        @repo/otto-widget
    secrets:
      package_read_token: ${{ secrets.GHCR_PAT }}

  secrets:
    name: Secrets
    uses: tesserix/tesserix-workflows/.github/workflows/secret-scan.yml@v2.2.1

  integration:
    name: Integration (marketplace-api)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: marketplace_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Host-side, because the job's steps run on the runner, not in a
      # container on the services network.
      DSN: postgres://dev:dev@127.0.0.1:5432/marketplace_db?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: services/marketplace-api/go.sum
      - name: Apply migrations
        working-directory: services/marketplace-api
        run: DATABASE_URL="$DSN" go run ./cmd/migrate up
      - name: Prove the database is actually reachable
        working-directory: services/marketplace-api
        # An integration test with no TEST_DATABASE_URL SKIPS and the package
        # still prints "ok" — a green suite here would otherwise prove nothing.
        # This canary must visibly RUN, so a broken DSN fails the job loudly
        # instead of passing silently.
        run: |
          out=$(TEST_DATABASE_URL="$DSN" go test -tags=integration -count=1 -v \
                  ./internal/product/... -run TestInventorySync_SumsAcrossLocations)
          printf '%s\n' "$out"
          grep -q -- '--- PASS: TestInventorySync_SumsAcrossLocations' <<<"$out" || {
            echo "::error::canary did not run — integration tests are skipping, not passing"
            exit 1
          }
      - name: Integration tests
        working-directory: services/marketplace-api
        # -p 1: the packages share one database; parallel runs exhaust
        # connections and surface as data pollution rather than as a clear
        # failure.
        run: TEST_DATABASE_URL="$DSN" go test -tags=integration -p 1 -count=1 ./...

  containers:
    name: Containers
    if: ${{ github.event_name == 'pull_request' }}
    needs: policy
    uses: tesserix/tesserix-workflows/.github/workflows/container-ci.yml@v2.2.1
    with:
      images: ${{ needs.policy.outputs.images }}
    secrets:
      registry_token: ${{ secrets.GHCR_PAT }}
      package_read_token: ${{ secrets.GHCR_PAT }}
      application_build_secret: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
      public_build_arg_1: ${{ secrets.NEXT_PUBLIC_GIP_PROJECT_ID }}
      public_build_arg_2: ${{ secrets.NEXT_PUBLIC_GIP_TENANT_ID }}
      public_build_arg_3: ${{ secrets.NEXT_PUBLIC_GIP_API_KEY }}
      public_build_arg_4: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      public_build_arg_5: ${{ secrets.NEXT_PUBLIC_STOREFRONT_GOOGLE_CLIENT_ID }}
      public_build_arg_6: ${{ secrets.NEXT_PUBLIC_MARKETING_URL }}
      public_build_arg_7: ${{ secrets.NEXT_PUBLIC_ADMIN_URL_TEMPLATE }}
      public_build_arg_8: ${{ secrets.NEXT_PUBLIC_ADMIN_LOGIN_ORIGIN }}

  release:
    name: Images
    if: ${{ contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
    needs: [policy, go, nextjs, secrets]
    uses: tesserix/tesserix-workflows/.github/workflows/container-release.yml@v2.2.1
    with:
      namespace: tesserix
      images: ${{ needs.policy.outputs.images }}
    secrets:
      registry_token: ${{ secrets.GHCR_PAT }}
      package_read_token: ${{ secrets.GHCR_PAT }}
      application_build_secret: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
      public_build_arg_1: ${{ secrets.NEXT_PUBLIC_GIP_PROJECT_ID }}
      public_build_arg_2: ${{ secrets.NEXT_PUBLIC_GIP_TENANT_ID }}
      public_build_arg_3: ${{ secrets.NEXT_PUBLIC_GIP_API_KEY }}
      public_build_arg_4: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      public_build_arg_5: ${{ secrets.NEXT_PUBLIC_STOREFRONT_GOOGLE_CLIENT_ID }}
      public_build_arg_6: ${{ secrets.NEXT_PUBLIC_MARKETING_URL }}
      public_build_arg_7: ${{ secrets.NEXT_PUBLIC_ADMIN_URL_TEMPLATE }}
      public_build_arg_8: ${{ secrets.NEXT_PUBLIC_ADMIN_LOGIN_ORIGIN }}

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [policy, go, nextjs, secrets, integration, containers, release]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse failed or cancelled gates
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          test "$HAS_FAILURE" = false
          test "$HAS_CANCELLED" = false
