name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [platform-api, auth-bff]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...
      - name: build
        working-directory: services/${{ matrix.service }}
        run: go build ./...
      - name: test
        working-directory: services/${{ matrix.service }}
        run: go test ./...

  node:
    name: Node + Turbo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install
      - run: npx turbo run lint check-types build --filter='!@mark8ly/platform-api' --filter='!@mark8ly/auth-bff'
