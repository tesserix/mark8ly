name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  policy:
    name: Product policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.images.outputs.value }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate CI contract
        run: python3 .github/scripts/test-ci-contract.py
      - name: Test OpenBao operational helpers
        run: python3 -m unittest discover -s scripts/ops/tests -v
      - name: Enforce application-credential choke point
        working-directory: services/marketplace-api
        run: |
          offenders=$(grep -RlE '"cloud\.google\.com/go/secretmanager' internal cmd --include='*.go' 2>/dev/null \
            | grep -vE '^(internal/billing/appcreds|internal/breakglass|internal/carriersecrets|cmd/break-glass-rotation|cmd/marketplace-api/main\.go)' \
            || true)
          if [[ -n "$offenders" ]]; then
            printf 'Secret Manager import outside the approved choke point:\n%s\n' "$offenders"
            exit 1
          fi
      - name: Export image contract
        id: images
        run: echo "value=$(jq -c . .github/ci/container-images.json)" >> "$GITHUB_OUTPUT"

  go:
    name: Go (${{ matrix.service }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: platform-api
            directory: services/platform-api
            coverage: 25
          - service: auth-bff
            directory: services/auth-bff
            coverage: 31
          - service: marketplace-api
            directory: services/marketplace-api
            coverage: 21
          - service: otto
            directory: services/otto
            coverage: 4
          - service: platformauth
            directory: packages/platformauth
            coverage: 80
    uses: tesserix/tesserix-workflows/.github/workflows/go-ci.yml@v2.3.0
    with:
      working_directory: ${{ matrix.directory }}
      go_version: 1.26.6
      coverage_min_lines: ${{ matrix.coverage }}

  nextjs:
    name: Next.js
    uses: tesserix/tesserix-workflows/.github/workflows/nextjs-ci.yml@v2.3.0
    with:
      working_directory: .
      node_version: "24"
      audit_workspaces: >-
        @mark8ly/admin
        @mark8ly/storefront
        @mark8ly/onboarding
        @repo/ui
        @repo/otto-widget
      # image-size DoS in the ICNS (GHSA-w3rx-r6r6-pgpr) and JXL/HEIF
      # (GHSA-5p2g-fcmc-qvqq) parsers. Build-time only:
      #   apps/mobile-* -> react-native -> @react-native/community-cli-plugin
      #                 -> metro -> image-size
      # metro measures image assets while bundling; the package is in no
      # deployed service image and nothing in production feeds it untrusted
      # ICNS/JXL/HEIF, so there is no production exposure to a parser DoS.
      #
      # Nothing to upgrade to: both advisories list `image-size <= 2.0.2`
      # affected with first patched version NONE, and 2.0.2 is the latest
      # release — so `npm audit fix`, `--force` and an `overrides` pin all
      # have nothing to point at. Left un-allowlisted these blocked EVERY PR
      # in the repo (main went red on an unchanged lockfile when npm's feed
      # picked them up on 2026-09-02; they were published 2026-06-10).
      #
      # audit_workspaces above does NOT exclude these — `npm audit
      # --workspace=` still audits the hoisted root tree, so react-native
      # surfaces even though the mobile apps are not listed.
      #
      # The gate tolerates a vulnerability only when its COMPLETE advisory
      # set is listed, so metro/react-native picking up anything unrelated
      # still fails. Revisit on the next react-native bump: drop these two
      # ids and see whether the chain has been patched upstream.
      #
      # GHSA-86w9-cpqp-85rv joins them on the SAME criterion, published
      # 2026-10-02 and red on main within the hour. It is reported against
      # @react-native/dev-middleware and @react-native/community-cli-plugin
      # but the vulnerable package is node-forge (RSA PKCS#1 v1.5
      # signature verification accepts extra nested DigestAlgorithm
      # elements), reached two ways, both dev tooling:
      #   apps/mobile-admin -> expo -> @expo/cli -> node-forge
      #   packages/mobile-shared -> react-native
      #     -> @react-native/community-cli-plugin
      #     -> @react-native/dev-middleware -> selfsigned -> node-forge
      # selfsigned mints the Metro dev server's HTTPS certificate; @expo/cli
      # signs development manifests. Neither runs in a deployed service
      # image nor ships inside an app binary.
      #
      # Nothing to upgrade to, verified rather than assumed: the advisory
      # covers node-forge <= 1.4.0 with first patched version NONE, and
      # 1.4.0 IS the latest release. npm offers `react-native@0.87.1` /
      # `expo@44.0.6` as the fix, and both are a semver-major move that
      # would not fix it — node-forge 1.4.0 is already present under
      # mobile-admin's expo 56 / react-native 0.85.3.
      #
      # Drop this id the moment node-forge publishes 1.4.1 or later.
      #
      # GHSA-vfj7-8cjw-p6xm joins them on the SAME criterion, published
      # 2026-10-03 and red on main within hours, on an unchanged lockfile.
      # Reported against a dozen jest and @react-native/* packages, but the
      # vulnerable package is braces (stack exhaustion through deeply
      # nested patterns), reached once:
      #   apps/mobile-admin -> tailwindcss
      #     -> chokidar / micromatch -> braces
      # tailwind's file watcher and glob matcher, at build time. In no
      # deployed service image and in no app binary; nothing in production
      # feeds either one an untrusted glob.
      #
      # Nothing to upgrade to, verified rather than assumed: the advisory
      # covers braces <= 3.0.3 with first patched version NONE, and 3.0.3
      # IS the latest release. There is exactly one instance in the tree
      # and it is already on it.
      #
      # Drop this id the moment braces publishes 3.0.4 or later.
      #
      # The six ids that used to sit here alongside image-size were the
      # 2026-09-08 batch tracked by #864. They are gone rather than
      # allowlisted: #867/#868 patched them, and #869 regenerated the
      # lockfile without --legacy-peer-deps so the fixes actually resolve.
      # Measured on 2026-09-09 across all three Next.js workspaces: the only
      # high-or-above advisories remaining are the two image-size ids below.
      #
      # The 2026-10-01 batch is likewise patched, not allowlisted:
      # GHSA-vcvr-r3jv-pc5j (CRITICAL, RCE in next/og ImageResponse,
      # affecting next 16.2.0-16.3.5) by moving the three Next apps to
      # ^16.3.8, and the three brace-expansion DoS ids by raising the
      # existing override floors — >=5.0.12 <6 for the ^5.x consumers and a
      # new >=1.1.21 <2 for minimatch@3's ^1.1.7, which had no override and
      # was sitting on 1.1.18. Both are patch bumps inside their majors; the
      # upper bounds matter, because an unbounded >=1.1.21 resolves a
      # CommonJS consumer onto brace-expansion 5.x.
      # GHSA-hp3w-g68c-fv3c joins them on the SAME criterion, published
      # 2026-10-06 and red on every open PR within hours, on an unchanged
      # lockfile. Reported against a dozen jest, metro and @react-native/*
      # packages, but the vulnerable package is sprintf-js, reached twice
      # and both times through dev tooling:
      #   apps/mobile-admin -> @react-native/jest-preset -> babel-jest
      #     -> babel-plugin-istanbul -> @istanbuljs/load-nyc-config
      #     -> js-yaml -> argparse -> sprintf-js
      #   packages/mobile-shared -> react-native
      #     -> @react-native/community-cli-plugin -> metro-config
      #     -> cosmiconfig -> js-yaml -> argparse -> sprintf-js
      # Jest's coverage instrumentation and Metro's config loader. Neither
      # runs in a deployed service image nor ships inside an app binary.
      #
      # Nothing to upgrade to, verified rather than assumed: the advisory
      # covers sprintf-js <= 1.1.3 with first patched version NONE, and
      # 1.1.3 IS the latest release. npm offers expo@44.0.6 as the fix,
      # which is a semver-major move that would not fix it — the reachable
      # copy is sprintf-js 1.0.3 pinned under argparse 1.0.10, which
      # neither expo nor react-native controls.
      #
      # Drop this id the moment sprintf-js publishes 1.1.4 or later.
      #
      # GHSA-68fv-2mgg-jv7q arrived in the same batch and is deliberately
      # NOT here: source-map-js 1.2.2 IS the patched release, so it is
      # fixed by an override in package.json rather than allowlisted.
      # Allowlist only what genuinely has no fix.
      audit_allowlist: >-
        GHSA-w3rx-r6r6-pgpr GHSA-5p2g-fcmc-qvqq GHSA-86w9-cpqp-85rv GHSA-vfj7-8cjw-p6xm GHSA-hp3w-g68c-fv3c
    secrets:
      package_read_token: ${{ secrets.GHCR_PAT }}

  secrets:
    name: Secrets
    uses: tesserix/tesserix-workflows/.github/workflows/secret-scan.yml@v2.3.0

  integration:
    name: Integration (marketplace-api)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: marketplace_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Host-side, because the job's steps run on the runner, not in a
      # container on the services network.
      DSN: postgres://dev:dev@127.0.0.1:5432/marketplace_db?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: services/marketplace-api/go.sum
      - name: Apply migrations
        working-directory: services/marketplace-api
        run: DATABASE_URL="$DSN" go run ./cmd/migrate up
      - name: Prove the database is actually reachable
        working-directory: services/marketplace-api
        # An integration test with no TEST_DATABASE_URL SKIPS and the package
        # still prints "ok" — a green suite here would otherwise prove nothing.
        # This canary must visibly RUN, so a broken DSN fails the job loudly
        # instead of passing silently.
        run: |
          out=$(TEST_DATABASE_URL="$DSN" go test -tags=integration -count=1 -v \
                  ./internal/product/... -run TestInventorySync_SumsAcrossLocations)
          printf '%s\n' "$out"
          grep -q -- '--- PASS: TestInventorySync_SumsAcrossLocations' <<<"$out" || {
            echo "::error::canary did not run — integration tests are skipping, not passing"
            exit 1
          }
      - name: Integration tests
        working-directory: services/marketplace-api
        # -p 1: the packages share one database; parallel runs exhaust
        # connections and surface as data pollution rather than as a clear
        # failure.
        run: TEST_DATABASE_URL="$DSN" go test -tags=integration -p 1 -count=1 ./...

  containers:
    name: Containers
    if: ${{ github.event_name == 'pull_request' }}
    needs: policy
    uses: tesserix/tesserix-workflows/.github/workflows/container-ci.yml@v2.3.0
    with:
      images: ${{ needs.policy.outputs.images }}
    secrets:
      registry_token: ${{ secrets.GHCR_PAT }}
      package_read_token: ${{ secrets.GHCR_PAT }}
      application_build_secret: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
      public_build_arg_1: ${{ secrets.NEXT_PUBLIC_GIP_PROJECT_ID }}
      public_build_arg_2: ${{ secrets.NEXT_PUBLIC_GIP_TENANT_ID }}
      public_build_arg_3: ${{ secrets.NEXT_PUBLIC_GIP_API_KEY }}
      public_build_arg_4: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      public_build_arg_5: ${{ secrets.NEXT_PUBLIC_STOREFRONT_GOOGLE_CLIENT_ID }}
      public_build_arg_6: ${{ secrets.NEXT_PUBLIC_MARKETING_URL }}
      public_build_arg_7: ${{ secrets.NEXT_PUBLIC_ADMIN_URL_TEMPLATE }}
      public_build_arg_8: ${{ secrets.NEXT_PUBLIC_ADMIN_LOGIN_ORIGIN }}

  release:
    name: Images
    if: ${{ contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
    needs: [policy, go, nextjs, secrets]
    uses: tesserix/tesserix-workflows/.github/workflows/container-release.yml@v2.3.0
    with:
      namespace: tesserix
      images: ${{ needs.policy.outputs.images }}
    secrets:
      registry_token: ${{ secrets.GHCR_PAT }}
      package_read_token: ${{ secrets.GHCR_PAT }}
      application_build_secret: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
      public_build_arg_1: ${{ secrets.NEXT_PUBLIC_GIP_PROJECT_ID }}
      public_build_arg_2: ${{ secrets.NEXT_PUBLIC_GIP_TENANT_ID }}
      public_build_arg_3: ${{ secrets.NEXT_PUBLIC_GIP_API_KEY }}
      public_build_arg_4: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      public_build_arg_5: ${{ secrets.NEXT_PUBLIC_STOREFRONT_GOOGLE_CLIENT_ID }}
      public_build_arg_6: ${{ secrets.NEXT_PUBLIC_MARKETING_URL }}
      public_build_arg_7: ${{ secrets.NEXT_PUBLIC_ADMIN_URL_TEMPLATE }}
      public_build_arg_8: ${{ secrets.NEXT_PUBLIC_ADMIN_LOGIN_ORIGIN }}

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [policy, go, nextjs, secrets, integration, containers, release]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse failed or cancelled gates
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          test "$HAS_FAILURE" = false
          test "$HAS_CANCELLED" = false
